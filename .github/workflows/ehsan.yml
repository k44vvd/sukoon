name: Update Ehsan numbers and gold price
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ehsan.py
        continue-on-error: true
      - run: python3 scripts/gold.py
        continue-on-error: true
      - run: |
          git config user.name "sukoon-bot"
          git config user.email "sukoon-bot@users.noreply.github.com"
          git add ehsan.json gold.json 2>/dev/null || git add ehsan.json
          git diff --cached --quiet || (git commit -m "تحديث أرقام إحسان وسعر الذهب" && git push)
